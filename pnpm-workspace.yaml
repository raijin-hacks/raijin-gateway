packages:
  - packages/*
  - apps/*

# pnpm 10 skips dependency install scripts unless the package is listed here.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Supply-chain guard: never install a version published less than 7 days ago.
minimumReleaseAge: 10080

overrides:
  # Recharts (dashboard) pulls immer ^11; the newest 11.x was under two weeks old when added.
  immer: 11.1.21
