name: Secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" /tmp/gitleaks_checksums.txt \
            | (cd /tmp && sha256sum -c -)
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Working tree only. Does not fail on the old deleted .env that is still
      # in git history (rotate that admin token before making the repo public).
      - name: Scan the checkout
        run: gitleaks detect --no-git --redact --verbose --source . --config .gitleaks.toml

      # New commits on a PR, so a secret added then removed in the same branch still fails.
      - name: Scan commits on this pull request
        if: github.event_name == 'pull_request'
        run: >
          gitleaks detect --redact --verbose --config .gitleaks.toml
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Scan commits pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >
          gitleaks detect --redact --verbose --config .gitleaks.toml
          --log-opts="${{ github.event.before }}..${{ github.sha }}"
