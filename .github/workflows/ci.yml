name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run PyTest
        run: python -m pytest

  inspect:
    name: Inspect application tooling
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.tooling.outputs.has_app }}
      lint: ${{ steps.tooling.outputs.lint }}
      format: ${{ steps.tooling.outputs.format }}
      typecheck: ${{ steps.tooling.outputs.typecheck }}
      test: ${{ steps.tooling.outputs.test }}
      build: ${{ steps.tooling.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect application and validate check scripts
        id: tooling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('package.json')) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=false\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Node application checks pending\nNode dependency installation, lint, format, type checks, tests, and build are skipped until a root package.json is added. Python tests run independently. See .github/workflows/README.md for the required scripts.\n');
            process.exit(0);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^pnpm@\d+\.\d+\.\d+(?:\+.*)?$/.test(pkg.packageManager || '')) {
            throw new Error('Pin an exact pnpm version in package.json packageManager.');
          }
          if (!fs.existsSync('pnpm-lock.yaml')) {
            throw new Error('Commit pnpm-lock.yaml for reproducible pnpm installs.');
          }
          const checks = { lint: 'lint', format: 'format:check', typecheck: 'typecheck', test: 'test', build: 'build' };
          const missing = [];
          for (const [output, script] of Object.entries(checks)) {
            const available = typeof pkg.scripts?.[script] === 'string' && !!pkg.scripts[script].trim();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${available}\n`);
            if (!available) missing.push(script);
          }
          if (missing.length) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## Application checks pending\nMissing root scripts: ${missing.join(', ')}. These checks are skipped until implemented; frozen dependency installation still runs.\n`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=true\n');
          NODE

  checks:
    name: Lint, format, types, tests, and build
    needs: inspect
    if: needs.inspect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: needs.inspect.outputs.lint == 'true'
        run: pnpm run lint
      - name: Check formatting
        if: needs.inspect.outputs.format == 'true'
        run: pnpm run format:check
      - name: Check types
        if: needs.inspect.outputs.typecheck == 'true'
        run: pnpm run typecheck
      - name: Test
        if: needs.inspect.outputs.test == 'true'
        run: pnpm run test
      - name: Build
        if: needs.inspect.outputs.build == 'true'
        run: pnpm run build

# CD PLACEHOLDER: docs/Design.md specifies a local demo and only tentative Azure hosting.
# Add deployment after a host, build artifact, environment, and credentials are defined.
# Gate any future deployment on successful checks and a push to main (never a PR).
