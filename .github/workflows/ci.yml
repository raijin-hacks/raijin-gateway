name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run PyTest
        run: python -m pytest

  inspect:
    name: Inspect application tooling
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.tooling.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect application and validate check scripts
        id: tooling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('package.json')) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=false\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Node application checks pending\nNode dependency installation, lint, format, type checks, tests, and build are skipped until a root package.json is added. Python tests run independently. See .github/workflows/README.md for the required scripts.\n');
            process.exit(0);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.packageManager?.startsWith('pnpm@')) {
            throw new Error('Set "packageManager": "pnpm@<exact version>" in package.json; CI installs that pnpm version.');
          }
          if (!fs.existsSync('pnpm-lock.yaml')) {
            throw new Error('Commit a root pnpm-lock.yaml for reproducible frozen-lockfile installs.');
          }
          const required = ['lint', 'format:check', 'typecheck', 'test', 'build'];
          const missing = required.filter(name => typeof pkg.scripts?.[name] !== 'string' || !pkg.scripts[name].trim());
          if (missing.length) throw new Error(`Missing required package.json scripts: ${missing.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=true\n');
          NODE

  checks:
    name: Lint, format, types, tests, and build
    needs: inspect
    if: needs.inspect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Check types
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

# CD PLACEHOLDER: Design.md specifies a local demo and only tentative Azure hosting.
# Add deployment after a host, build artifact, environment, and credentials are defined.
# Gate any future deployment on successful checks and a push to main (never a PR).
