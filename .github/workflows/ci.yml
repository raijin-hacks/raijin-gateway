name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run PyTest
        run: python -m pytest

  inspect:
    name: Inspect application tooling
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.tooling.outputs.has_app }}
      package_manager: ${{ steps.tooling.outputs.package_manager }}
      lockfile: ${{ steps.tooling.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect application and validate check scripts
        id: tooling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('package.json')) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=false\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Node application checks pending\nNode dependency installation, lint, format, type checks, tests, and build are skipped until a root package.json is added. Python tests run independently. See .github/workflows/README.md for the required scripts.\n');
            process.exit(0);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manager = pkg.packageManager?.split('@')[0] ||
            (fs.existsSync('pnpm-lock.yaml') ? 'pnpm' : 'npm');
          if (!['npm', 'pnpm'].includes(manager)) {
            throw new Error(`Unsupported package manager: ${manager}. CI supports npm and pnpm.`);
          }
          if (manager === 'pnpm' && !/^pnpm@\d+\.\d+\.\d+/.test(pkg.packageManager || '')) {
            throw new Error('Pin pnpm in package.json packageManager (for example, pnpm@10.0.0).');
          }
          const lockfile = manager === 'pnpm' ? 'pnpm-lock.yaml' : 'package-lock.json';
          if (!fs.existsSync(lockfile)) {
            throw new Error(`Commit a root ${lockfile} for reproducible ${manager} installs.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_manager=${manager}\nlockfile=${lockfile}\n`);
          const required = ['lint', 'format:check', 'typecheck', 'test', 'build'];
          const missing = required.filter(name => typeof pkg.scripts?.[name] !== 'string' || !pkg.scripts[name].trim());
          if (missing.length) throw new Error(`Missing required package.json scripts: ${missing.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_app=true\n');
          NODE

  checks:
    name: Lint, format, types, tests, and build
    needs: inspect
    if: needs.inspect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        if: needs.inspect.outputs.package_manager == 'pnpm'
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ needs.inspect.outputs.package_manager }}
          cache-dependency-path: ${{ needs.inspect.outputs.lockfile }}
      - name: Install npm dependencies
        if: needs.inspect.outputs.package_manager == 'npm'
        run: npm ci
      - name: Install pnpm dependencies
        if: needs.inspect.outputs.package_manager == 'pnpm'
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: ${{ needs.inspect.outputs.package_manager }} run lint
      - name: Check formatting
        run: ${{ needs.inspect.outputs.package_manager }} run format:check
      - name: Check types
        run: ${{ needs.inspect.outputs.package_manager }} run typecheck
      - name: Test
        run: ${{ needs.inspect.outputs.package_manager }} run test
      - name: Build
        run: ${{ needs.inspect.outputs.package_manager }} run build

# CD PLACEHOLDER: docs/Design.md specifies a local demo and only tentative Azure hosting.
# Add deployment after a host, build artifact, environment, and credentials are defined.
# Gate any future deployment on successful checks and a push to main (never a PR).
